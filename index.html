<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quill — typing, measured</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090B;--bg2:#111114;--bg3:#18181D;--a:#A78BFA;--b:#8B5CF6;--t:#F4F4F5;--t2:#85858F;--t3:#52525B;--err:#F87171;--fs:28px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t);font:14px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px clamp(16px,4vw,40px)}
.logo{font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;color:var(--t);text-decoration:none}
.logo:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--a)}
.links{display:flex;gap:4px}
nav a.l{display:flex;gap:7px;align-items:center;padding:7px 12px;border-radius:8px;color:var(--t2);text-decoration:none;transition:color .15s,background .15s}
nav a.l:hover{color:var(--t)}nav a.l.on{color:var(--t);background:var(--bg3)}
nav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:12px clamp(16px,4vw,40px) 32px}
.view{display:none}.view.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.rm *,.rm *:before{animation:none!important;transition:none!important}
.pills{display:flex;justify-content:center;margin:6vh 0 28px}
.pills div{display:flex;background:var(--bg2);border-radius:10px;padding:3px}
.p{padding:6px 16px;border-radius:7px;color:var(--t2);transition:.15s;font-variant-numeric:tabular-nums}
.p:hover{color:var(--t)}.p.on{background:var(--bg3);color:var(--a)}
.live{display:flex;align-items:baseline;gap:28px;height:48px;opacity:.35;transition:opacity .2s;font-variant-numeric:tabular-nums}
.live.run{opacity:1}
.live b{font-size:34px;font-weight:500;color:var(--a);letter-spacing:-.02em}
.live span{color:var(--t2);font-size:15px}.live span i{font-style:normal;color:var(--t);margin-left:6px}
.box{position:relative;overflow:hidden;margin-top:8px;cursor:text}
.sh{position:relative;transition:transform .15s ease-out}
.ti{display:flex;flex-wrap:wrap;font:400 var(--fs)/1.7 'JetBrains Mono',ui-monospace,monospace;color:var(--t3);transition:filter .2s,opacity .2s;user-select:none}
.box.off .ti{filter:blur(5px);opacity:.5}
.w{margin-right:.6em;display:inline-block}.w i{font-style:normal}
.c{color:var(--t)}.x{color:var(--err)}.e{color:var(--err);opacity:.65}
.bad{text-decoration:underline var(--err) 2px;text-underline-offset:6px}
.cur{position:absolute;left:0;top:0;width:2px;border-radius:1px;background:var(--a);transition:transform .09s ease-out;pointer-events:none}
.ns .cur,.ns .sh{transition:none}
.cur.bl{animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--t2);pointer-events:none;opacity:0;transition:opacity .2s}
.box.off .hint{opacity:1}
#inp{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0}
.foot{margin-top:40px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap;color:var(--t3);font-size:12px}
kbd{font:inherit;background:var(--bg2);padding:1px 7px;border-radius:5px;color:var(--t2);margin-right:5px}
h2{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:12px 0 20px}
h3{font-size:12px;font-weight:500;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin:36px 0 12px}
.big{display:flex;gap:56px;margin:4vh 0 24px;flex-wrap:wrap}
.big label,.cell label{display:block;color:var(--t2);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.big b{font-size:clamp(52px,10vw,88px);font-weight:500;line-height:1.05;color:var(--a);letter-spacing:-.04em}
.big div+div b{color:var(--t)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--bg3);border-radius:12px;overflow:hidden;margin-bottom:20px}
.cell{background:var(--bg2);padding:16px 18px}.cell b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.card{background:var(--bg2);border-radius:12px;padding:20px 16px 16px}
.ch{position:relative;height:200px;margin-left:34px;touch-action:pan-y}
.ch svg{display:block;position:absolute;inset:0}
.ya{position:absolute;left:-34px;color:var(--t3);font-size:11px;width:28px;text-align:right}
.dot{position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--a);box-shadow:0 0 0 4px #a78bfa30;pointer-events:none;display:none}
.tip{position:absolute;top:-6px;background:var(--bg3);padding:4px 9px;border-radius:6px;font-size:12px;white-space:nowrap;pointer-events:none;display:none;transform:translateX(-50%)}
.act{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{padding:9px 16px;border-radius:9px;background:var(--bg3);color:var(--t);transition:.15s}.btn:hover{background:#222229}
.btn.pri{background:var(--b)}.btn.pri:hover{filter:brightness(1.12)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.cards .cell{border-radius:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.two{grid-template-columns:1fr}.live{gap:18px}.big{gap:32px}nav a.l span{display:none}.pills{margin-top:3vh}}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:9px 8px;text-align:left;font-weight:400;border-bottom:1px solid var(--bg3)}th{color:var(--t3);font-size:12px}
td:first-child{font-family:'JetBrains Mono',monospace;color:var(--a)}
.bar{height:4px;border-radius:2px;background:var(--bg3);min-width:50px}.bar i{display:block;height:100%;border-radius:2px;background:var(--a)}
.ins{list-style:none;padding:0;display:grid;gap:8px}.ins li{background:var(--bg2);padding:13px 16px;border-radius:10px;border-left:2px solid var(--b)}
.empty{text-align:center;color:var(--t2);padding:18vh 0;line-height:1.8}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--bg3);flex-wrap:wrap}
.row p{color:var(--t2);font-size:13px}.row b{font-weight:500}
.ctl{display:flex;gap:6px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;opacity:.55;transition:.15s}.sw.on{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--t2)}
.tg{width:38px;height:22px;border-radius:11px;background:var(--bg3);position:relative;transition:.2s}
.tg:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--t2);transition:.2s}
.tg.on{background:var(--b)}.tg.on:after{left:19px;background:#fff}
input[type=range]{accent-color:var(--b);width:150px}
::selection{background:#8b5cf64d}
button:focus-visible,a:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.prog{height:2px;background:var(--bg3);border-radius:1px;margin:4px 0 18px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--a);transition:width .1s linear}
.pills{gap:12px;flex-wrap:wrap}.p{font-size:13px}
.cur{box-shadow:0 0 12px var(--a)}
.ti{animation:in .35s}
.badge{display:inline-block;margin-left:12px;padding:2px 10px;border-radius:20px;background:#8b5cf633;color:var(--a);font-size:12px;vertical-align:middle;letter-spacing:0;text-transform:none}
.cell,.card,.ins li{transition:background .2s}.cell:hover{background:#15151a}
.sg{display:flex;background:var(--bg2);border-radius:8px;padding:2px}

html{scroll-behavior:smooth}
body{background:radial-gradient(900px 480px at 50% -8%,#8b5cf61c,transparent 70%),var(--bg);background-attachment:fixed}
em{font-style:normal}
nav{transition:opacity .4s ease;position:relative;z-index:30}
body.typing nav{opacity:.16}body.typing nav:hover,body.typing nav:focus-within{opacity:1}
.view.on{animation:in .4s cubic-bezier(.2,.7,.2,1)}
.btn,.p,.sw,nav a.l,.lb,.tg,.tg:after{transition:background .2s,color .2s,transform .18s,box-shadow .2s,filter .2s,opacity .2s,left .2s}
.btn:active,.p:active,.sw:active{transform:scale(.95)}
.sw:hover{opacity:1;transform:scale(1.15)}
.cell,.card{border:1px solid #ffffff09}.cell:hover{transform:translateY(-1px)}
.cell{transition:background .2s,transform .2s}
.cur{transition:transform .12s cubic-bezier(.2,.8,.2,1)}
.sh{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.w i{transition:color .1s}
.badge{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{opacity:0;transform:scale(.6)}}
.row{transition:background .2s}
.lm{position:relative;margin-left:4px}
.lb{display:flex;gap:7px;align-items:center;padding:7px 12px;border-radius:8px;color:var(--t2)}
.lb:hover,.lm.open .lb{color:var(--t);background:var(--bg3)}
nav .lb .cv{width:11px;height:11px;transition:transform .2s}.lm.open .cv{transform:rotate(180deg)}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:40;min-width:210px;max-height:min(70vh,420px);overflow:auto;padding:6px;background:#111114f2;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--bg3);border-radius:12px;box-shadow:0 18px 40px #0009;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .18s,transform .18s,visibility .18s}
.lm.open .menu{opacity:1;visibility:visible;transform:none}
.menu button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:20px;padding:9px 12px;border-radius:8px;color:var(--t2);text-align:left;transition:background .15s,color .15s}
.menu button:hover{background:var(--bg3);color:var(--t)}.menu button.on{color:var(--a)}
.menu b{font:500 11px 'JetBrains Mono',monospace;color:var(--t3)}.menu button.on b{color:var(--a)}
</style></head>

 if(c1!=null&&c2!=null&&Math.abs(c1-c2)>=2)o.push(c1>c2?`You are more accurate on common words (${Math.round(c1)}%) than on the rest (${Math.round(c2)}%).`:`Surprisingly, common words (${Math.round(c1)}%) trip you up more than the rest (${Math.round(c2)}%).`);
 if(!o.length)o.push('Complete a few more tests to unlock insights.');return o}
async function renderStats(){const el=$('#v-stats');let T=[];try{T=await Store.all()}catch(e){}
 if(!T.length){el.innerHTML='<div class="empty">'+tr('emp')+'</div>';return}
 const K={},Wd={};T.forEach(t=>{for(const k in t.keys){const a=K[k]||(K[k]=[0,0,0,0]),b=t.keys[k];for(let i=0;i<4;i++)a[i]+=b[i]}for(const w in t.words){const a=Wd[w]||(Wd[w]=[0,0,0]),b=t.words[w];for(let i=0;i<3;i++)a[i]+=b[i]}});
 const best=Math.max(...T.map(t=>t.wpm)),C=[[tr('tst'),T.length],[tr('aw'),Math.round(avg(T.map(t=>t.wpm)))],[tr('bw'),best],[tr('aa'),avg(T.map(t=>t.acc)).toFixed(1)+'%'],[tr('ct'),T.reduce((s,t)=>s+t.chars,0).toLocaleString(S.lang)]];
 const wk=Object.entries(K).filter(([k,a])=>a[0]>=10).map(([k,a])=>({k,acc:100-a[1]/a[0]*100,err:a[1],ms:a[3]?Math.round(a[2]/a[3]):0})).sort((a,b)=>a.acc-b.acc||b.err-a.err).slice(0,8);
 const ww=Object.entries(Wd).filter(([w,a])=>a[1]>0).map(([w,a])=>({w,bad:a[1],ok:a[0],acc:a[0]/(a[0]+a[1])*100,ms:Math.round(a[2]/(a[0]+a[1]))})).sort((a,b)=>b.bad-a.bad||a.acc-b.acc).slice(0,8);
 const row=x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`;
 el.innerHTML=`<h2>${tr('stats')}</h2><div class="cards">${C.map(c=>`<div class="cell"><label>${c[0]}</label><b>${c[1]}</b></div>`).join('')}</div>
 <h3>${tr('ins')}</h3><ul class="ins">${insights(T,K,Wd).map(s=>`<li>${s}</li>`).join('')}</ul>
 <div class="two"><div><h3>${tr('wh')}</h3><div class="card"><div class="ch" id="h1"></div></div></div><div><h3>${tr('ah')}</h3><div class="card"><div class="ch" id="h2"></div></div></div></div>
 <div class="two"><div><h3>${tr('wk')}</h3><div class="card">${wk.length?`<table><tr><th>${tr('key')}</th><th>${cap(tr('acc'))}</th><th></th><th>${tr('err')}</th><th>ms</th></tr>${wk.map(x=>row([x.k.toUpperCase(),x.acc.toFixed(1)+'%',`<div class="bar"><i style="width:${x.acc}%"></i></div>`,x.err,x.ms||'–'])).join('')}</table>`:`<p style="color:var(--t2)">${tr('nok')}</p>`}</div></div>
 <div><h3>${tr('mw')}</h3><div class="card">${ww.length?`<table><tr><th>${tr('word')}</th><th>${tr('wr')}</th><th>${tr('ri')}</th><th>${cap(tr('acc'))}</th><th>ms</th></tr>${ww.map(x=>row([x.w,x.bad,x.ok,Math.round(x.acc)+'%',x.ms])).join('')}</table>`:`<p style="color:var(--t2)">${tr('nmw')}</p>`}</div></div></div>`;
 const H=T.slice(-60),dt=i=>new Date(H[i].ts).toLocaleDateString(S.lang);
 const draw=()=>{if(view!=='stats'||!$('#h1'))return;chart($('#h1'),H.map(t=>t.wpm),(i,v)=>`${dt(i)} · ${v} wpm`);chart($('#h2'),H.map(t=>Math.round(t.acc*10)/10),(i,v)=>`${dt(i)} · ${v}%`)};
 draw();renderStats.draw=draw}

function renderSet(){const R=(l,d,c)=>`<div class="row"><div><b>${l}</b><p>${d}</p></div><div class="ctl">${c}</div></div>`,tg=k=>`<button class="tg ${S[k]?'on':''}" data-t="${k}" aria-label="toggle"></button>`;
 $('#v-set').innerHTML='<h2>'+tr('set')+'</h2>'
 +R(tr('acn'),'',Object.keys(ACC).map(k=>`<button class="sw ${S.accent===k?'on':''}" data-a="${k}" style="background:${ACC[k][0]}" title="${k}"></button>`).join(''))
 +R(tr('fs'),S.fs+'px',`<input type="range" min="18" max="40" value="${S.fs}" id="fs">`)
 +R(tr('dd'),'',`<div class="sg">${[15,30,60,120].map(d=>`<button class="p ${S.dur===d?'on':''}" data-d="${d}">${d}s</button>`).join('')}</div>`)
 +R(tr('pun'),'Aa, bb.',tg('punct'))
 +R(tr('snd'),'',tg('sound'))
 +R(tr('smc'),'',tg('smooth'))
 +R(tr('red'),'',tg('reduce'))
 +R(tr('rst'),'',`<button class="btn" id="rs">${tr('rb')}</button>`)}
$('#v-set').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.a)S.accent=t.dataset.a;else if(t.dataset.t)S[t.dataset.t]=!S[t.dataset.t];else if(t.dataset.d)S.dur=+t.dataset.d;
 else if(t.id==='rs'){if(t.dataset.c){Store.clear().catch(()=>{});t.textContent=tr('cl');delete t.dataset.c}else{t.dataset.c=1;t.textContent=tr('cf');setTimeout(()=>{if(t.dataset.c){delete t.dataset.c;t.textContent=tr('rb')}},3000)}return}
 else return;save();apply();renderSet()});
$('#v-set').addEventListener('input',e=>{if(e.target.id==='fs'){S.fs=+e.target.value;e.target.closest('.row').querySelector('p').textContent=S.fs+'px';save();apply()}});
